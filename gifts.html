<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giftly – Browse Gifts</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="nav.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #FDF8F2;
      --ink:        #1A1410;
      --blush:      #F2A28A;
      --blush-dark: #D97B5C;
      --muted:      #7A6F68;
      --border:     #E8E0D8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* Page header */
    .page-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 2rem 1.5rem;
    }

    .page-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blush-dark);
      margin-bottom: 0.6rem;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .page-sub {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Filters bar */
    .filters-bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .categories { display: flex; gap: 0.5rem; flex-wrap: wrap; flex: 1; }

    .cat-chip {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .cat-chip:hover { border-color: var(--blush-dark); color: var(--blush-dark); }
    .cat-chip.active { background: var(--ink); border-color: var(--ink); color: var(--cream); }

    .budget-filter {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .budget-filter select {
      padding: 0.42rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.86rem;
      color: var(--ink);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    .budget-filter select:focus { border-color: var(--blush-dark); }

    /* Gift grid */
    .gift-grid-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    .results-count {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .gift-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.25rem;
    }

    .gift-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: visible;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .gift-card:hover { box-shadow: 0 6px 24px rgba(26,20,16,0.09); transform: translateY(-2px); }
    .gift-card.assigned { border-color: var(--blush); box-shadow: 0 0 0 2px var(--blush); }

    .gift-thumb {
      height: 145px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      flex-shrink: 0;
      border-radius: 16px 16px 0 0;
      overflow: hidden;
      text-decoration: none;
    }

    .gift-body {
      padding: 1.1rem 1.2rem 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .gift-source {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .gift-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.05rem;
      line-height: 1.3;
      margin-bottom: 0.35rem;
    }
    .gift-name a { color: var(--ink); text-decoration: none; }
    .gift-name a:hover { text-decoration: underline; text-underline-offset: 3px; }

    .gift-desc {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
      margin-bottom: 1rem;
    }

    .gift-footer {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .gift-footer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .gift-price { font-size: 1rem; font-weight: 600; }

    .gift-footer-actions { display: flex; gap: 0.5rem; align-items: center; }

    .btn-view {
      padding: 0.45rem 0.9rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.83rem;
      font-weight: 500;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
      transition: border-color 0.15s;
    }
    .btn-view:hover { border-color: var(--ink); }

    /* Person picker */
    .person-picker { position: relative; }

    .btn-assign {
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--blush);
      background: transparent;
      color: var(--blush-dark);
      white-space: nowrap;
      transition: all 0.15s;
    }
    .btn-assign:hover { background: var(--blush); color: var(--ink); }
    .btn-assign.has-assignments { background: var(--blush); color: var(--ink); border-color: var(--blush); }

    .picker-dropdown {
      position: absolute;
      bottom: calc(100% + 6px);
      right: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(26,20,16,0.12);
      min-width: 180px;
      overflow: hidden;
      z-index: 30;
      display: none;
    }
    .picker-dropdown.open { display: block; }

    .picker-header {
      padding: 0.6rem 0.9rem 0.4rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .picker-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0.9rem;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
    }
    .picker-option:hover { background: var(--cream); }
    .picker-option.assigned { color: var(--blush-dark); }
    .picker-option .check { font-size: 0.8rem; color: var(--blush-dark); }

    .picker-empty {
      padding: 0.75rem 0.9rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .picker-empty a { color: var(--blush-dark); font-weight: 500; text-decoration: none; }
    .picker-empty a:hover { text-decoration: underline; }

    /* Assigned tags */
    .assigned-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .assigned-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #FFF0EB;
      border: 1px solid var(--blush);
      color: var(--blush-dark);
      border-radius: 100px;
      padding: 0.2rem 0.65rem;
      font-size: 0.78rem;
      font-weight: 500;
    }

    /* Empty / no-session states */
    .empty {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty p { font-size: 0.95rem; line-height: 1.6; }

    /* Recommendation badge */
    .rec-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.7rem;
      border-radius: 100px;
      background: var(--blush);
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      margin-bottom: 0.5rem;
      white-space: nowrap;
    }

    /* Person filter in filters bar */
    .person-filter {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .person-filter select {
      padding: 0.42rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.86rem;
      color: var(--ink);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    .person-filter select:focus { border-color: var(--blush-dark); }
    .person-filter.active select { border-color: var(--blush-dark); background: #FFF0EB; }

    /* Clear person filter link */
    .clear-person {
      background: none;
      border: none;
      font-size: 0.82rem;
      color: var(--muted);
      cursor: pointer;
      padding: 0;
      font-family: 'Inter', sans-serif;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .clear-person:hover { color: var(--ink); }

    @media (max-width: 600px) {
      nav { padding: 1.2rem 1.25rem; }
      .page-header { padding: 2rem 1.25rem 1rem; }
      .filters-bar { padding: 1rem 1.25rem; gap: 1rem; }
      .gift-grid-wrap { padding: 1.5rem 1.25rem; }
      .gift-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    }
    @media (max-width: 420px) {
      .gift-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    <div class="budget-filter">

        <option value="50">Under $50</option>
        <option value="100">Under $100</option>

    </div>
    <div class="person-filter" id="personFilterWrap" style="display:none">

      <select id="personFilter" onchange="setActivePerson()">

      // Outdoor
      { id: 31, cat: 'outdoor',    name: 'GSI Outdoors Enamel Mug Set (Set of 2)',     desc: 'Durable speckled enamel steel, 14oz each, rolled lip and loop handle. Classic camp aesthetic.',                               price: 28,  source: 'Amazon',      icon: '⛺', bg: '#F0FFF4', interests: ['Sports','Travel','Cooking'],         url: 'https://www.amazon.com/dp/B0015EMVO2' },

      // Experiences
      { id: 37, cat: 'experience', name: 'MasterClass All-Access Annual Pass',         desc: 'Unlimited access to 180+ instructors: Gordon Ramsay, Serena Williams, Neil deGrasse Tyson, and more.',                        price: 120, source: 'MasterClass', icon: '👨‍🍳', bg: '#F5F0FF', interests: ['Cooking','Sports','Music','Tech'],   url: 'https://www.masterclass.com/gift' },
      { id: 38, cat: 'experience', name: 'Pottery Class for Two – Classpop',           desc: 'Beginner wheel-throwing with a local ceramicist. All clay included, take your pieces home. 200+ cities.',                     price: 120, source: 'Classpop',    icon: '🏺', bg: '#F5F0FF', interests: [],                                    url: 'https://www.classpop.com/pottery-classes' },
      { id: 39, cat: 'experience', name: 'Virtual Wine Tasting with a Sommelier',      desc: 'Curated 3-bottle kit ships to their door. 90-min live Zoom tasting with a certified sommelier.',                              price: 95,  source: 'Airbnb',      icon: '🍷', bg: '#F5F0FF', interests: ['Cooking'],                           url: 'https://www.airbnb.com/s/experiences?query=wine+tasting' },
      { id: 40, cat: 'experience', name: 'SpaFinder Gift Card ($100)',                 desc: 'Redeemable at 20,000+ spas and salons nationwide. No expiration. Delivered by email instantly.',                              price: 100, source: 'SpaFinder',   icon: '💆', bg: '#F5F0FF', interests: ['Fashion'],                           url: 'https://www.spafinder.com/gift-cards' },
      { id: 41, cat: 'experience', name: 'Airbnb Experience – Sunset Sail (2 guests)', desc: '2-hour sailing excursion with champagne for two. Available in 50+ coastal cities. Book directly on Airbnb.',                 price: 150, source: 'Airbnb',      icon: '⛵', bg: '#F5F0FF', interests: ['Sports','Travel'],                   url: 'https://www.airbnb.com/s/experiences?query=sailing' },
      { id: 42, cat: 'experience', name: 'Stargazing Night Gift Kit',                  desc: 'Personalized star map of a meaningful date, cozy blanket, insulated thermos, and printed constellation guide.',               price: 62,  source: 'Etsy',        icon: '🌠', bg: '#F5F0FF', interests: ['Travel'],                            url: 'https://www.etsy.com/search?q=stargazing+night+gift+kit+star+map' },
    ];

    // ── State ─────────────────────────────────────────────────
    let userEmail   = null;
    let profiles    = [];      // [{id, name, relationship, interests}]
    // Map<giftId, [{profileId, profileName}]>
    let assignments = new Map();
    let activeCategory = 'all';
    let openPickerId   = null;  // giftId whose dropdown is open
    let activePerson   = null;  // profile object for interest-based sorting

    // ── Boot ──────────────────────────────────────────────────
    async function init() {
      userEmail = sessionStorage.getItem('giftlyEmail');

      await Promise.all([
        loadProfiles(),
        loadAssignments(),
      ]);

      renderGifts();

      document.addEventListener('click', handleGlobalClick);
    }

    async function loadProfiles() {
      if (!userEmail) return;
      try {
        const res = await fetch(`http://localhost:3000/profiles?email=${encodeURIComponent(userEmail)}`);
        profiles = await res.json();
        if (profiles.length > 0) {
          const sel = document.getElementById('personFilter');
          profiles.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.name;
            sel.appendChild(opt);
          });
          document.getElementById('personFilterWrap').style.display = 'flex';
        }
      } catch (_) { /* server offline — no profiles */ }
    }

    async function loadAssignments() {
      if (!userEmail) return;
      try {
        const res = await fetch(`http://localhost:3000/gifts?email=${encodeURIComponent(userEmail)}`);
        const rows = await res.json();
        rows.forEach(r => {
          if (!assignments.has(r.giftId)) assignments.set(r.giftId, []);
          const list = assignments.get(r.giftId);
          if (!list.find(a => a.profileId === r.profileId)) {
            list.push({ profileId: r.profileId, profileName: r.profileName });
          }
        });
      } catch (_) { /* server offline */ }
    }

    // ── Filters ───────────────────────────────────────────────
    function setCategory(cat, el) {
      activeCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderGifts();
    }

    function setActivePerson() {
      const val = document.getElementById('personFilter').value;
      activePerson = val ? profiles.find(p => String(p.id) === val) || null : null;
      const wrap = document.getElementById('personFilterWrap');
      if (wrap) wrap.classList.toggle('active', !!activePerson);
      renderGifts();
    }

    function clearPerson() {
      activePerson = null;
      const sel = document.getElementById('personFilter');
      if (sel) sel.value = '';
      const wrap = document.getElementById('personFilterWrap');
      if (wrap) wrap.classList.remove('active');
      renderGifts();
    }

    function getBudgetRange() {
      const v = document.getElementById('budgetFilter').value;
      if (v === 'all') return [0, Infinity];
      if (v === '101') return [100, Infinity];
      return [0, parseInt(v)];
    }

    // ── Helpers ───────────────────────────────────────────────
    function personInterests() {
      if (!activePerson) return [];
      try { return activePerson.interests ? JSON.parse(activePerson.interests) : []; } catch (e) { return []; }
    }

    function matchScore(g) {
      const pi = personInterests();
      return pi.length ? g.interests.filter(i => pi.includes(i)).length : 0;
    }

    // ── Rendering ─────────────────────────────────────────────
    function renderGifts() {
      const [min, max] = getBudgetRange();
      let filtered = GIFTS.filter(g => {
        const catOk   = activeCategory === 'all' || g.cat === activeCategory;
        const priceOk = g.price >= min && g.price <= max;
        return catOk && priceOk;
      });

      // Sort recommended gifts to the top when a person is selected
      if (activePerson && personInterests().length > 0) {
        filtered = [...filtered].sort((a, b) => matchScore(b) - matchScore(a));
      }

      const total = filtered.length;
      const resultsEl = document.getElementById('resultsCount');
      if (activePerson) {
        resultsEl.innerHTML = `${total} gift${total !== 1 ? 's' : ''} &nbsp;·&nbsp; <strong>Personalized for ${escHtml(activePerson.name)}</strong> &nbsp;<button class="clear-person" onclick="clearPerson()">✕ clear</button>`;
      } else {
        resultsEl.textContent = `${total} gift${total !== 1 ? 's' : ''}`;
      }

      const grid  = document.getElementById('giftGrid');
      const empty = document.getElementById('emptyState');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = filtered.map(giftCard).join('');
    }

    function giftCard(g) {
      const assigned = assignments.get(g.id) || [];
      const isAssigned = assigned.length > 0;
      const isRecommended = matchScore(g) > 0;
      const recBadge = isRecommended
        ? `<div class="rec-badge">⭐ Recommended for ${escHtml(activePerson.name)}</div>`
        : '';

      const pickerContent = profiles.length === 0
        ? `<div class="picker-empty">No people added yet.<br><a href="dashboard.html">Go to dashboard →</a></div>`
        : profiles.map(p => {
            const alreadyAssigned = assigned.some(a => a.profileId === p.id);
            return `<button class="picker-option${alreadyAssigned ? ' assigned' : ''}"
              onclick="assignGift(event, ${g.id}, ${p.id}, '${escHtml(p.name)}')">
              ${escHtml(p.name)}
              ${alreadyAssigned ? '<span class="check">✓</span>' : ''}
            </button>`;
          }).join('');

      const assignedTags = assigned.map(a =>
        `<span class="assigned-tag">🎁 For ${escHtml(a.profileName)}</span>`
      ).join('');

      return `
        <div class="gift-card${isAssigned ? ' assigned' : ''}" id="card-${g.id}">
          <a href="${g.url}" target="_blank" rel="noopener noreferrer" class="gift-thumb" style="background:${g.bg}">
            ${g.icon}
          </a>
          <div class="gift-body">
            ${recBadge}
            <p class="gift-source">${g.source}</p>
            <h3 class="gift-name"><a href="${g.url}" target="_blank" rel="noopener noreferrer">${g.name}</a></h3>
            <p class="gift-desc">${g.desc}</p>
            <div class="gift-footer">
              <div class="gift-footer-top">
                <span class="gift-price">$${g.price}</span>
                <div class="gift-footer-actions">
                  <a href="${g.url}" target="_blank" rel="noopener noreferrer" class="btn-view">View ↗</a>
                  <div class="person-picker">
                    <button class="btn-assign${isAssigned ? ' has-assignments' : ''}"
                      onclick="togglePicker(event, ${g.id})">
                      ${isAssigned ? `For ${assigned.map(a => escHtml(a.profileName)).join(', ')} ▾` : 'Select for… ▾'}
                    </button>
                    <div class="picker-dropdown${openPickerId === g.id ? ' open' : ''}" id="picker-${g.id}">
                      <div class="picker-header">Assign to</div>
                      ${pickerContent}
                    </div>
                  </div>
                </div>
              </div>
              ${assigned.length > 0 ? `<div class="assigned-tags">${assignedTags}</div>` : ''}
            </div>
          </div>
        </div>`;
    }

    // ── Picker ────────────────────────────────────────────────
    function togglePicker(e, giftId) {
      e.stopPropagation();
      openPickerId = openPickerId === giftId ? null : giftId;
      renderGifts();
      if (openPickerId) {
        const el = document.getElementById(`picker-${giftId}`);
        el?.scrollIntoView({ block: 'nearest' });
      }
    }

    function handleGlobalClick() {
      if (openPickerId !== null) {
        openPickerId = null;
        renderGifts();
      }
    }

    // ── Assign ────────────────────────────────────────────────
    async function assignGift(e, giftId, profileId, profileName) {
      e.stopPropagation();

      const gift = GIFTS.find(g => g.id === giftId);
      if (!gift) return;

      const list = assignments.get(giftId) || [];
      if (list.find(a => a.profileId === profileId)) {
        openPickerId = null;
        renderGifts();
        return;
      }

      if (!assignments.has(giftId)) assignments.set(giftId, []);
      assignments.get(giftId).push({ profileId, profileName });
      openPickerId = null;

      // Activate interest filter for the chosen person
      activePerson = profiles.find(p => p.id === profileId) || activePerson;
      const sel = document.getElementById('personFilter');
      if (sel) sel.value = String(profileId);
      const wrap = document.getElementById('personFilterWrap');
      if (wrap) wrap.classList.toggle('active', !!activePerson);

      renderGifts();

      try {
        const res = await fetch('http://localhost:3000/gifts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userEmail,
            profileId,
            profileName,
            giftId:    gift.id,
            giftName:  gift.name,
            giftPrice: gift.price,
            giftSource: gift.source,
            giftUrl:   gift.url,
          }),
        });

        if (!res.ok) {
          // Roll back optimistic update on failure
          const l = assignments.get(giftId);
          const idx = l.findIndex(a => a.profileId === profileId);
          if (idx !== -1) l.splice(idx, 1);
          if (l.length === 0) assignments.delete(giftId);
          renderGifts();
        }
      } catch (_) {
        // Server offline — keep optimistic assignment locally
      }
    }

    // ── Util ──────────────────────────────────────────────────
    function escHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    init();
  </script>

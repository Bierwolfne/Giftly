<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giftly – Browse Gifts</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #FDF8F2;
      --ink:        #1A1410;
      --blush:      #F2A28A;
      --blush-dark: #D97B5C;
      --muted:      #7A6F68;
      --border:     #E8E0D8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--cream);
      z-index: 10;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .nav-link {
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-link:hover { color: var(--ink); }

    .saved-badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--ink);
      color: var(--cream);
      padding: 0.5rem 1.1rem;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .saved-badge:hover { background: var(--blush-dark); }

    .saved-count {
      background: var(--blush);
      color: var(--ink);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.05rem 0.45rem;
      min-width: 1.2rem;
      text-align: center;
      transition: transform 0.2s;
    }

    /* Page header */
    .page-header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 2rem 1.5rem;
    }

    .page-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blush-dark);
      margin-bottom: 0.6rem;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .page-sub {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* Filters bar */
    .filters-bar {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .categories {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      flex: 1;
    }

    .cat-chip {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .cat-chip:hover {
      border-color: var(--blush-dark);
      color: var(--blush-dark);
    }

    .cat-chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--cream);
    }

    .budget-filter {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .budget-filter select {
      padding: 0.42rem 0.8rem;
      border: 1.5px solid var(--border);
      border-radius: 100px;
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.86rem;
      color: var(--ink);
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }

    .budget-filter select:focus { border-color: var(--blush-dark); }

    /* Gift grid */
    .gift-grid-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    .results-count {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .gift-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .gift-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, transform 0.15s;
    }

    .gift-card:hover {
      box-shadow: 0 6px 24px rgba(26,20,16,0.09);
      transform: translateY(-2px);
    }

    .gift-card.saved {
      border-color: var(--blush);
      box-shadow: 0 0 0 2px var(--blush);
    }

    .gift-thumb {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      flex-shrink: 0;
    }

    .gift-body {
      padding: 1.1rem 1.2rem 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .gift-source {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .gift-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.05rem;
      line-height: 1.3;
      margin-bottom: 0.4rem;
    }

    .gift-desc {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.55;
      flex: 1;
      margin-bottom: 1rem;
    }

    .gift-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .gift-price {
      font-size: 1rem;
      font-weight: 600;
    }

    .gift-name a {
      color: var(--ink);
      text-decoration: none;
    }
    .gift-name a:hover { text-decoration: underline; text-underline-offset: 3px; }

    .gift-footer { flex-direction: column; align-items: flex-start; gap: 0.75rem; }

    .gift-actions { display: flex; gap: 0.5rem; align-items: center; }

    .btn-view {
      padding: 0.45rem 0.95rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-view:hover { border-color: var(--ink); }

    .btn-save {
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 1.5px solid var(--blush);
      background: transparent;
      color: var(--blush-dark);
    }

    .btn-save:hover {
      background: var(--blush);
      color: var(--ink);
    }

    .btn-save.saved {
      background: var(--blush);
      color: var(--ink);
      border-color: var(--blush);
    }

    .btn-save.saved:hover {
      background: #e88060;
      border-color: #e88060;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--muted);
    }

    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }

    .empty p {
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* Saved drawer */
    .saved-drawer {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--ink);
      color: var(--cream);
      border-radius: 14px;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.92rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 100;
      white-space: nowrap;
    }

    .saved-drawer.visible { transform: translateX(-50%) translateY(0); }

    .drawer-text { flex: 1; }
    .drawer-text strong { font-weight: 600; }

    .drawer-cta {
      background: var(--blush);
      color: var(--ink);
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .drawer-cta:hover { background: var(--blush-dark); color: var(--cream); }

    @media (max-width: 600px) {
      nav { padding: 1.2rem 1.25rem; }
      .page-header { padding: 2rem 1.25rem 1rem; }
      .filters-bar { padding: 1rem 1.25rem; gap: 1rem; }
      .gift-grid-wrap { padding: 1.5rem 1.25rem; }
      .gift-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    }

    @media (max-width: 420px) {
      .gift-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    let activeCategory = 'all';
    let savedIds = new Set();

    function setCategory(cat, el) {
      activeCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderGifts();
    }

    function getBudgetMax() {
      const v = document.getElementById('budgetFilter').value;
      if (v === 'all') return Infinity;
      if (v === '101') return Infinity;
      return parseInt(v);
    }

    function getBudgetMin() {
      const v = document.getElementById('budgetFilter').value;
      return v === '101' ? 100 : 0;
    }

    function renderGifts() {
      const max = getBudgetMax();
      const min = getBudgetMin();

      const filtered = GIFTS.filter(g => {
        const catMatch = activeCategory === 'all' || g.cat === activeCategory;
        const budgetMatch = g.price >= min && g.price <= max;
        return catMatch && budgetMatch;
      });

      const count = document.getElementById('resultsCount');
      const grid = document.getElementById('giftGrid');
      const empty = document.getElementById('emptyState');

      count.textContent = `${filtered.length} gift${filtered.length !== 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      grid.innerHTML = filtered.map(g => `
        <div class="gift-card${savedIds.has(g.id) ? ' saved' : ''}" id="card-${g.id}">
          <a href="${g.url}" target="_blank" rel="noopener noreferrer" style="display:block;text-decoration:none">
            <div class="gift-thumb" style="background:${g.bg}">${g.icon}</div>
          </a>
          <div class="gift-body">
            <p class="gift-source">${g.source}</p>
            <h3 class="gift-name"><a href="${g.url}" target="_blank" rel="noopener noreferrer">${g.name}</a></h3>
            <p class="gift-desc">${g.desc}</p>
            <div class="gift-footer">
              <span class="gift-price">$${g.price}</span>
              <div class="gift-actions">
                <a href="${g.url}" target="_blank" rel="noopener noreferrer" class="btn-view">View ↗</a>
                <button class="btn-save${savedIds.has(g.id) ? ' saved' : ''}" onclick="toggleSave(${g.id})">
                  ${savedIds.has(g.id) ? '✓ Saved' : '+ Save'}
                </button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function toggleSave(id) {
      if (savedIds.has(id)) {
        savedIds.delete(id);
      } else {
        savedIds.add(id);
      }
      updateSavedUI();
      renderGifts();
    }

    function updateSavedUI() {
      const n = savedIds.size;
      document.getElementById('savedCount').textContent = n;
      document.getElementById('drawerCount').textContent = n;
      document.getElementById('drawerPlural').textContent = n === 1 ? '' : 's';

      const drawer = document.getElementById('savedDrawer');
      if (n > 0) {
        drawer.classList.add('visible');
      } else {
        drawer.classList.remove('visible');
      }
    }

    function scrollToSaved() {
      // placeholder — would open saved list view
    }

    renderGifts();
  </script>

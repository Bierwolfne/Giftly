<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giftly – Log In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="nav.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #FDF8F2;
      --ink:        #1A1410;
      --blush:      #F2A28A;
      --blush-dark: #D97B5C;
      --muted:      #7A6F68;
      --border:     #E8E0D8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    .page {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 5rem 2rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    .card-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blush-dark);
      margin-bottom: 0.75rem;
    }

    .card h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }

    .card-sub {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .field { margin-bottom: 1.2rem; }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--ink);
    }

    .field input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--blush-dark); }

    .btn-primary {
      width: 100%;
      background: var(--blush);
      color: var(--ink);
      border: none;
      padding: 0.85rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-primary:hover { background: var(--blush-dark); color: var(--cream); transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .success-msg {
      display: none;
      background: #F0FFF4;
      border: 1px solid #9AE6B4;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      font-size: 0.92rem;
      color: #276749;
      margin-top: 1rem;
    }

    .error-msg {
      display: none;
      background: #FFF5F5;
      border: 1px solid #FEB2B2;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      font-size: 0.92rem;
      color: #9B2C2C;
      margin-top: 1rem;
    }

    .divider {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin: 1.5rem 0;
      position: relative;
    }
    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .signup-link {
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .signup-link a { color: var(--blush-dark); text-decoration: none; font-weight: 500; }
    .signup-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav id="siteNav"></nav>

  <div class="page">
    <div class="card">
      <p class="card-eyebrow">Welcome back</p>
      <h1>Log in to Giftly</h1>
      <p class="card-sub">Good to see you. Enter your details to pick up where you left off.</p>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password" />
      </div>

      <button class="btn-primary" id="submitBtn" onclick="handleLogin()">Log in</button>

      <div class="success-msg" id="successMsg">
        👋 Welcome back! Redirecting you now…
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <div class="divider">or</div>

      <p class="signup-link">New to Giftly? <a href="signup.html">Create an account</a></p>
    </div>
  </div>

  <script>
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });

    async function handleLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn        = document.getElementById('submitBtn');
      const successMsg = document.getElementById('successMsg');
      const errorMsg   = document.getElementById('errorMsg');

      errorMsg.style.display  = 'none';
      successMsg.style.display = 'none';

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Logging in…';

      try {
        const res  = await fetch('', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok) {
          sessionStorage.setItem('giftlyEmail', data.email);
          if (data.name) sessionStorage.setItem('giftlyName', data.name);
          successMsg.style.display = 'block';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
        } else {
          showError(data.error || 'Something went wrong. Please try again.');
          btn.disabled    = false;
          btn.textContent = 'Log in';
        }
      } catch (err) {
        showError('Could not reach the server. Make sure it\'s running on port 3000.');
        btn.disabled    = false;
        btn.textContent = 'Log in';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent    = msg;
      el.style.display  = 'block';
    }
  </script>

</body>
</html>

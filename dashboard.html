<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giftly – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #FDF8F2;
      --ink:        #1A1410;
      --blush:      #F2A28A;
      --blush-dark: #D97B5C;
      --muted:      #7A6F68;
      --border:     #E8E0D8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--cream);
      z-index: 10;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .nav-link {
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .nav-link:hover { color: var(--ink); }

    .nav-cta {
      background: var(--ink);
      color: var(--cream);
      border: none;
      padding: 0.55rem 1.3rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .nav-cta:hover { background: var(--blush-dark); }

    /* Page header */
    .page-header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3.5rem 2rem 1.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .page-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blush-dark);
      margin-bottom: 0.5rem;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .add-btn {
      background: var(--blush);
      color: var(--ink);
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s;
    }
    .add-btn:hover { background: var(--blush-dark); color: var(--cream); transform: translateY(-1px); }

    /* Stats row */
    .stats-row {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 2rem 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .stat-chip strong { color: var(--ink); }

    /* Profile grid */
    .profile-grid-wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .profile-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .profile-card:hover { box-shadow: 0 6px 24px rgba(26,20,16,0.08); transform: translateY(-2px); }

    .card-top {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--blush);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .card-identity { flex: 1; min-width: 0; }

    .card-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-relation {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .card-divider {
      height: 1px;
      background: var(--border);
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .birthday-info { flex: 1; }

    .birthday-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }

    .birthday-date {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .days-badge {
      padding: 0.35rem 0.85rem;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .days-today    { background: #FED7D7; color: #9B2C2C; }
    .days-soon     { background: #FEEBC8; color: #7B341E; }
    .days-upcoming { background: #FEEBC8; color: #744210; }
    .days-normal   { background: var(--cream); color: var(--muted); border: 1px solid var(--border); }
    .days-none     { background: var(--cream); color: var(--muted); border: 1px solid var(--border); }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 5rem 2rem;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    .empty p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    /* Loading skeleton */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .skeleton-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem;
    }

    .skel {
      background: linear-gradient(90deg, #f0e8e0 25%, #e8ddd4 50%, #f0e8e0 75%);
      background-size: 200% 100%;
      border-radius: 6px;
      animation: shimmer 1.4s infinite;
    }

    .skel-avatar { width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; }
    .skel-line   { height: 14px; margin-bottom: 8px; }
    .skel-short  { width: 55%; }
    .skel-long   { width: 80%; }

    .skeleton-top { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .skeleton-lines { flex: 1; }
    .skeleton-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .skel-badge { width: 80px; height: 28px; border-radius: 100px; }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* No-session banner */
    .banner {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 1rem 1.5rem;
      background: #FFFBEB;
      border: 1px solid #F6E05E;
      border-radius: 12px;
      font-size: 0.92rem;
      color: #744210;
    }
    .banner a { color: var(--blush-dark); font-weight: 500; }

    @media (max-width: 600px) {
      nav { padding: 1.2rem 1.25rem; }
      .page-header { padding: 2rem 1.25rem 1rem; }
      .stats-row { padding: 0 1.25rem 1.5rem; }
      .profile-grid-wrap { padding: 0 1.25rem 3rem; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">Giftly</a>
    <div class="nav-right">
      <a href="gifts.html" class="nav-link">Browse gifts</a>
      <a href="profiles.html" class="nav-cta">+ Add person</a>
    </div>
  </nav>

  <div id="app">
    <!-- rendered by JS -->
  </div>

  <script>
    const relationEmoji = {
      'Mom': '👩', 'Dad': '👨', 'Partner': '💑',
      'Friend': '🤝', 'Sibling': '👫', 'Other': '🎁'
    };

    function daysUntilBirthday(birthdayStr) {
      if (!birthdayStr) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const bday = new Date(birthdayStr + 'T00:00:00');
      const next = new Date(today.getFullYear(), bday.getMonth(), bday.getDate());
      if (next < today) next.setFullYear(today.getFullYear() + 1);
      return Math.round((next - today) / (1000 * 60 * 60 * 24));
    }

    function formatDate(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
    }

    function daysBadge(days) {
      if (days === null) return `<span class="days-badge days-none">No birthday set</span>`;
      if (days === 0)    return `<span class="days-badge days-today">🎂 Today!</span>`;
      if (days <= 7)     return `<span class="days-badge days-soon">🔔 ${days}d away</span>`;
      if (days <= 30)    return `<span class="days-badge days-upcoming">${days} days</span>`;
      return `<span class="days-badge days-normal">${days} days</span>`;
    }

    function renderCard(p) {
      const days = daysUntilBirthday(p.birthday);
      const dateStr = formatDate(p.birthday);
      return `
        <div class="profile-card">
          <div class="card-top">
            <div class="avatar">${relationEmoji[p.relationship] || '🎁'}</div>
            <div class="card-identity">
              <div class="card-name">${p.name}</div>
              <div class="card-relation">${p.relationship}</div>
            </div>
          </div>
          <div class="card-divider"></div>
          <div class="card-bottom">
            <div class="birthday-info">
              <div class="birthday-label">Birthday</div>
              <div class="birthday-date">${dateStr || 'Not set'}</div>
            </div>
            ${daysBadge(days)}
          </div>
        </div>
      `;
    }

    function renderSkeleton(count = 3) {
      return Array.from({ length: count }, () => `
        <div class="skeleton-card">
          <div class="skeleton-top">
            <div class="skel skel-avatar"></div>
            <div class="skeleton-lines">
              <div class="skel skel-line skel-long"></div>
              <div class="skel skel-line skel-short"></div>
            </div>
          </div>
          <div class="skeleton-bottom">
            <div class="skel skel-line skel-short" style="height:12px"></div>
            <div class="skel skel-badge"></div>
          </div>
        </div>
      `).join('');
    }

    function upcomingCount(profiles) {
      return profiles.filter(p => {
        const d = daysUntilBirthday(p.birthday);
        return d !== null && d <= 30;
      }).length;
    }

    async function init() {
      const app = document.getElementById('app');
      const email = sessionStorage.getItem('giftlyEmail');

      if (!email) {
        app.innerHTML = `
          <div style="max-width:1000px;margin:2rem auto;padding:0 2rem">
            <div class="banner">
              No session found. <a href="signup.html">Sign up</a> or <a href="profiles.html">add people</a> to get started.
            </div>
          </div>`;
        return;
      }

      const firstName = email.split('@')[0];

      app.innerHTML = `
        <div class="page-header">
          <div>
            <p class="page-eyebrow">Your dashboard</p>
            <h1>Hello, ${firstName} 👋</h1>
          </div>
          <a href="profiles.html" class="add-btn">+ Add person</a>
        </div>
        <div class="stats-row" id="statsRow"></div>
        <div class="profile-grid-wrap">
          <div class="skeleton-grid">${renderSkeleton(3)}</div>
        </div>`;

      try {
        const res = await fetch(`http://localhost:3000/profiles?email=${encodeURIComponent(email)}`);
        const profiles = await res.json();

        const soon = upcomingCount(profiles);
        document.getElementById('statsRow').innerHTML = `
          <div class="stat-chip"><strong>${profiles.length}</strong> ${profiles.length === 1 ? 'person' : 'people'} saved</div>
          ${soon > 0 ? `<div class="stat-chip">🔔 <strong>${soon}</strong> birthday${soon === 1 ? '' : 's'} in the next 30 days</div>` : ''}
        `;

        const gridWrap = app.querySelector('.profile-grid-wrap');

        if (profiles.length === 0) {
          gridWrap.innerHTML = `
            <div class="empty">
              <div class="empty-icon">🎁</div>
              <h2>No people yet</h2>
              <p>Add the people you want to gift and we'll track their birthdays for you.</p>
              <a href="profiles.html" class="add-btn">Add your first person</a>
            </div>`;
          return;
        }

        // Sort by soonest birthday first
        profiles.sort((a, b) => {
          const da = daysUntilBirthday(a.birthday) ?? 999;
          const db = daysUntilBirthday(b.birthday) ?? 999;
          return da - db;
        });

        gridWrap.innerHTML = `<div class="profile-grid">${profiles.map(renderCard).join('')}</div>`;

      } catch (err) {
        app.querySelector('.profile-grid-wrap').innerHTML = `
          <div class="empty">
            <div class="empty-icon">⚠️</div>
            <h2>Could not load profiles</h2>
            <p>Make sure the Giftly server is running on port 3000.</p>
          </div>`;
      }
    }

    init();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giftly – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="nav.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #FDF8F2;
      --ink:        #1A1410;
      --blush:      #F2A28A;
      --blush-dark: #D97B5C;
      --muted:      #7A6F68;
      --border:     #E8E0D8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* Page header */
    .page-header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3.5rem 2rem 1.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .page-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blush-dark);
      margin-bottom: 0.5rem;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .add-btn {
      background: var(--blush);
      color: var(--ink);
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s;
    }
    .add-btn:hover { background: var(--blush-dark); color: var(--cream); transform: translateY(-1px); }

    /* Stats row */
    .stats-row {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 2rem 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .stat-chip {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .stat-chip strong { color: var(--ink); }

    /* Profile grid */
    .profile-grid-wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .profile-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .profile-card:hover { box-shadow: 0 6px 24px rgba(26,20,16,0.08); transform: translateY(-2px); }

    .card-top {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--blush);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .card-identity { flex: 1; min-width: 0; }

    .card-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.2rem;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-relation {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .card-divider {
      height: 1px;
      background: var(--border);
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .birthday-info { flex: 1; }

    .birthday-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }

    .birthday-date {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .days-badge {
      padding: 0.35rem 0.85rem;
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .days-today    { background: #FED7D7; color: #9B2C2C; }
    .days-soon     { background: #FEEBC8; color: #7B341E; }
    .days-upcoming { background: #FEEBC8; color: #744210; }
    .days-normal   { background: var(--cream); color: var(--muted); border: 1px solid var(--border); }
    .days-none     { background: var(--cream); color: var(--muted); border: 1px solid var(--border); }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 5rem 2rem;
    }
    .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      margin-bottom: 0.5rem;
    }
    .empty p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }

    /* Loading skeleton */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .skeleton-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.6rem;
    }

    .skel {
      background: linear-gradient(90deg, #f0e8e0 25%, #e8ddd4 50%, #f0e8e0 75%);
      background-size: 200% 100%;
      border-radius: 6px;
      animation: shimmer 1.4s infinite;
    }

    .skel-avatar { width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; }
    .skel-line   { height: 14px; margin-bottom: 8px; }
    .skel-short  { width: 55%; }
    .skel-long   { width: 80%; }

    .skeleton-top { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    .skeleton-lines { flex: 1; }
    .skeleton-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .skel-badge { width: 80px; height: 28px; border-radius: 100px; }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* No-session banner */
    .banner {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 1rem 1.5rem;
      background: #FFFBEB;
      border: 1px solid #F6E05E;
      border-radius: 12px;
      font-size: 0.92rem;
      color: #744210;
    }
    .banner a { color: var(--blush-dark); font-weight: 500; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26, 20, 16, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 460px;
      position: relative;
      transform: translateY(20px) scale(0.98);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: var(--cream);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--border); color: var(--ink); }

    .modal-eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blush-dark);
      margin-bottom: 0.5rem;
    }
    .modal h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.7rem;
      margin-bottom: 1.75rem;
      letter-spacing: -0.02em;
    }

    .modal .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .modal .field { margin-bottom: 1rem; }
    .modal .field:last-of-type { margin-bottom: 0; }
    .modal .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
    }
    .modal .field input,
    .modal .field select {
      width: 100%;
      padding: 0.72rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      background: var(--cream);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
    }
    .modal .field input:focus,
    .modal .field select:focus { border-color: var(--blush-dark); }

    .modal-error {
      display: none;
      background: #FFF5F5;
      border: 1px solid #FEB2B2;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
      color: #9B2C2C;
      margin-bottom: 1rem;
    }

    .btn-submit {
      width: 100%;
      background: var(--blush);
      color: var(--ink);
      border: none;
      padding: 0.85rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1.25rem;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-submit:hover:not(:disabled) { background: var(--blush-dark); color: var(--cream); transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Interest chips (modal form) */
    .interest-section { margin-top: 1rem; }
    .interest-section > label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.6rem;
    }
    .interest-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .interest-chip {
      position: relative;
    }
    .interest-chip input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .interest-chip label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.85rem;
      border-radius: 100px;
      border: 1.5px solid var(--border);
      background: var(--cream);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      user-select: none;
      white-space: nowrap;
    }
    .interest-chip input:checked + label {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--cream);
    }
    .interest-chip label:hover {
      border-color: var(--muted);
    }

    /* Interest tags on profile cards */
    .interest-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      padding-top: 0.75rem;
    }
    .interest-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      background: var(--cream);
      border: 1px solid var(--border);
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Upgrade banner */
    .upgrade-wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 2rem 1.5rem;
    }

    .upgrade-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: #FFF7ED;
      border: 1px solid var(--blush);
      border-radius: 14px;
      padding: 1rem 1.4rem;
      flex-wrap: wrap;
    }

    .upgrade-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      min-width: 0;
    }

    .upgrade-icon { font-size: 1.25rem; flex-shrink: 0; }

    .upgrade-text strong {
      display: block;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 0.1rem;
    }

    .upgrade-text span {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .upgrade-btn {
      background: var(--ink);
      color: var(--cream);
      border: none;
      padding: 0.6rem 1.3rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s;
    }
    .upgrade-btn:hover { background: var(--blush-dark); transform: translateY(-1px); }
    .upgrade-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .pro-status-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.9rem;
      border-radius: 100px;
      background: linear-gradient(135deg, #8B5CF6, #6D28D9);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--ink);
      color: var(--cream);
      border-radius: 100px;
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 200;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { background: #276749; }

    @media (max-width: 600px) {
      nav { padding: 1.2rem 1.25rem; }
      .page-header { padding: 2rem 1.25rem 1rem; }
      .stats-row { padding: 0 1.25rem 1.5rem; }
      .profile-grid-wrap { padding: 0 1.25rem 3rem; }
      .modal { padding: 2rem 1.5rem; }
      .modal .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <nav id="siteNav"></nav>

  <div id="app">
    <!-- rendered by JS -->
  </div>

  <div class="modal-backdrop" id="modalBackdrop" onclick="handleBackdropClick(event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
      <p class="modal-eyebrow">New profile</p>
      <h2 id="modalTitle">Add someone</h2>

      <div class="modal-error" id="modalError"></div>

      <div class="form-row">
        <div class="field">
          <label for="mName">Name</label>
          <input type="text" id="mName" placeholder="e.g. Mom" />
        </div>
        <div class="field">
          <label for="mRelation">Relationship</label>
          <select id="mRelation">
            <option value="">Select one</option>
            <option>Mom</option>
            <option>Dad</option>
            <option>Partner</option>
            <option>Friend</option>
            <option>Sibling</option>
            <option>Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="mBirthday">Birthday</label>
          <input type="date" id="mBirthday" />
        </div>
        <div class="field">
          <label for="mBudget">Gift budget</label>
          <select id="mBudget">
            <option value="">Select range</option>
            <option>Under $25</option>
            <option>$25 – $50</option>
            <option>$50 – $100</option>
            <option>$100+</option>
          </select>
        </div>
      </div>

      <div class="interest-section">
        <label>Interests</label>
        <div class="interest-chips">
          <div class="interest-chip"><input type="checkbox" id="mi-sports" value="Sports"><label for="mi-sports">🏃 Sports</label></div>
          <div class="interest-chip"><input type="checkbox" id="mi-reading" value="Reading"><label for="mi-reading">📚 Reading</label></div>
          <div class="interest-chip"><input type="checkbox" id="mi-tech" value="Tech"><label for="mi-tech">💻 Tech</label></div>
          <div class="interest-chip"><input type="checkbox" id="mi-fashion" value="Fashion"><label for="mi-fashion">👗 Fashion</label></div>
          <div class="interest-chip"><input type="checkbox" id="mi-gaming" value="Gaming"><label for="mi-gaming">🎮 Gaming</label></div>
          <div class="interest-chip"><input type="checkbox" id="mi-travel" value="Travel"><label for="mi-travel">✈️ Travel</label></div>
          <div class="interest-chip"><input type="checkbox" id="mi-cooking" value="Cooking"><label for="mi-cooking">🍳 Cooking</label></div>
          <div class="interest-chip"><input type="checkbox" id="mi-music" value="Music"><label for="mi-music">🎵 Music</label></div>
        </div>
      </div>

      <button class="btn-submit" id="modalSubmit" onclick="submitProfile()">Add person</button>
    </div>
  </div>

  <script>
    const relationEmoji = {
      'Mom': '👩', 'Dad': '👨', 'Partner': '💑',
      'Friend': '🤝', 'Sibling': '👫', 'Other': '🎁'
    };

    const interestEmoji = {
      'Sports': '🏃', 'Reading': '📚', 'Tech': '💻', 'Fashion': '👗',
      'Gaming': '🎮', 'Travel': '✈️', 'Cooking': '🍳', 'Music': '🎵'
    };

    let profiles = [];
    let userEmail = null;
    let subscriptionStatus = 'free';

    // ── Helpers ──────────────────────────────────────────────

    function daysUntilBirthday(birthdayStr) {
      if (!birthdayStr) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const bday = new Date(birthdayStr + 'T00:00:00');
      const next = new Date(today.getFullYear(), bday.getMonth(), bday.getDate());
      if (next < today) next.setFullYear(today.getFullYear() + 1);
      return Math.round((next - today) / (1000 * 60 * 60 * 24));
    }

    function formatDate(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
    }

    function daysBadge(days) {
      if (days === null) return `<span class="days-badge days-none">No birthday set</span>`;
      if (days === 0)    return `<span class="days-badge days-today">🎂 Today!</span>`;
      if (days <= 7)     return `<span class="days-badge days-soon">🔔 ${days}d away</span>`;
      if (days <= 30)    return `<span class="days-badge days-upcoming">${days} days</span>`;
      return `<span class="days-badge days-normal">${days} days</span>`;
    }

    function renderCard(p) {
      const days = daysUntilBirthday(p.birthday);
      const dateStr = formatDate(p.birthday);
      let interests = [];
      try { interests = p.interests ? JSON.parse(p.interests) : []; } catch (e) {}
      const tagsHtml = interests.length > 0
        ? `<div class="interest-tags">${interests.map(i => `<span class="interest-tag">${interestEmoji[i] || ''} ${i}</span>`).join('')}</div>`
        : '';
      return `
        <div class="profile-card">
          <div class="card-top">
            <div class="avatar">${relationEmoji[p.relationship] || '🎁'}</div>
            <div class="card-identity">
              <div class="card-name">${p.name}</div>
              <div class="card-relation">${p.relationship}</div>
            </div>
          </div>
          <div class="card-divider"></div>
          <div class="card-bottom">
            <div class="birthday-info">
              <div class="birthday-label">Birthday</div>
              <div class="birthday-date">${dateStr || 'Not set'}</div>
            </div>
            ${daysBadge(days)}
          </div>
          ${tagsHtml}
        </div>`;
    }

    function renderSkeleton(count = 3) {
      return `<div class="skeleton-grid">${Array.from({ length: count }, () => `
        <div class="skeleton-card">
          <div class="skeleton-top">
            <div class="skel skel-avatar"></div>
            <div class="skeleton-lines">
              <div class="skel skel-line skel-long"></div>
              <div class="skel skel-line skel-short"></div>
            </div>
          </div>
          <div class="skeleton-bottom">
            <div class="skel skel-line skel-short" style="height:12px"></div>
            <div class="skel skel-badge"></div>
          </div>
        </div>`).join('')}
      </div>`;
    }

    // ── Grid & stats rendering ────────────────────────────────

    function sortedProfiles() {
      return [...profiles].sort((a, b) => {
        const da = daysUntilBirthday(a.birthday) ?? 999;
        const db = daysUntilBirthday(b.birthday) ?? 999;
        return da - db;
      });
    }

    function renderGrid() {
      const gridWrap = document.getElementById('gridWrap');
      if (!gridWrap) return;

      if (profiles.length === 0) {
        gridWrap.innerHTML = `
          <div class="empty">
            <div class="empty-icon">🎁</div>
            <h2>No people yet</h2>
            <p>Add the people you want to gift and we'll track their birthdays for you.</p>
            <button class="add-btn" onclick="openModal()">Add your first person</button>
          </div>`;
        return;
      }

      gridWrap.innerHTML = `<div class="profile-grid">${sortedProfiles().map(renderCard).join('')}</div>`;
    }

    function renderStats() {
      const el = document.getElementById('statsRow');
      if (!el) return;
      const soon = profiles.filter(p => {
        const d = daysUntilBirthday(p.birthday);
        return d !== null && d <= 30;
      }).length;
      el.innerHTML = `
        <div class="stat-chip"><strong>${profiles.length}</strong> ${profiles.length === 1 ? 'person' : 'people'} saved</div>
        ${soon > 0 ? `<div class="stat-chip">🔔 <strong>${soon}</strong> birthday${soon === 1 ? '' : 's'} in the next 30 days</div>` : ''}`;
    }

    // ── Modal ─────────────────────────────────────────────────

    function openModal() {
      document.getElementById('mName').value = '';
      document.getElementById('mRelation').value = '';
      document.getElementById('mBirthday').value = '';
      document.getElementById('mBudget').value = '';
      document.querySelectorAll('.interest-chip input[type="checkbox"]').forEach(cb => cb.checked = false);
      hideModalError();
      document.getElementById('modalBackdrop').classList.add('open');
      document.getElementById('mName').focus();
      document.addEventListener('keydown', handleEscape);
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
      document.removeEventListener('keydown', handleEscape);
    }

    function handleBackdropClick(e) {
      if (e.target === e.currentTarget) closeModal();
    }

    function handleEscape(e) {
      if (e.key === 'Escape') closeModal();
    }

    function showModalError(msg) {
      const el = document.getElementById('modalError');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideModalError() {
      const el = document.getElementById('modalError');
      el.style.display = 'none';
    }

    async function submitProfile() {
      const name         = document.getElementById('mName').value.trim();
      const relationship = document.getElementById('mRelation').value;
      const birthday     = document.getElementById('mBirthday').value;
      const giftBudget   = document.getElementById('mBudget').value;
      const interests    = [...document.querySelectorAll('.interest-chip input:checked')].map(cb => cb.value);
      const btn          = document.getElementById('modalSubmit');

      hideModalError();

      if (!name || !relationship) {
        showModalError('Please enter a name and relationship.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/profiles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userEmail, name, relationship, birthday, giftBudget, interests }),
        });

        const data = await res.json();

        if (!res.ok) {
          showModalError(data.error || 'Could not save. Please try again.');
          return;
        }

        profiles.push(data);
        renderGrid();
        renderStats();
        closeModal();
      } catch (err) {
        showModalError('Could not reach the server. Make sure it\'s running on port 3000.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Add person';
      }
    }

    // ── Stripe ────────────────────────────────────────────────

    function renderUpgradeBanner() {
      const wrap = document.getElementById('upgradeBannerWrap');
      if (!wrap) return;
      const isPro = subscriptionStatus === 'active' || subscriptionStatus === 'past_due';
      if (isPro) {
        wrap.innerHTML = `
          <div class="upgrade-wrap">
            <div class="pro-status-chip">✨ Giftly Pro</div>
          </div>`;
      } else {
        wrap.innerHTML = `
          <div class="upgrade-wrap">
            <div class="upgrade-card">
              <div class="upgrade-left">
                <span class="upgrade-icon">✨</span>
                <div class="upgrade-text">
                  <strong>Upgrade to Giftly Pro</strong>
                  <span>Automated reminders, unlimited profiles &amp; more — $9.99/month</span>
                </div>
              </div>
              <button class="upgrade-btn" id="upgradeBtn" onclick="startCheckout()">Upgrade now →</button>
            </div>
          </div>`;
      }
    }

    async function startCheckout() {
      const btn = document.getElementById('upgradeBtn');
      if (btn) { btn.disabled = true; btn.textContent = 'Redirecting…'; }
      try {
        const res = await fetch('/create-checkout-session', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ userEmail }),
        });
        const data = await res.json();
        if (res.ok && data.url) {
          window.location.href = data.url;
        } else {
          showToast(data.error || 'Could not start checkout. Please try again.');
          if (btn) { btn.disabled = false; btn.textContent = 'Upgrade now →'; }
        }
      } catch (err) {
        showToast('Could not reach the server. Please try again.');
        if (btn) { btn.disabled = false; btn.textContent = 'Upgrade now →'; }
      }
    }

    function showToast(msg, type) {
      let el = document.getElementById('giftlyToast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'giftlyToast';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.className = 'toast' + (type === 'success' ? ' success' : '');
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('show')));
      setTimeout(() => el.classList.remove('show'), 4500);
    }

    // ── Init ──────────────────────────────────────────────────

    async function init() {
      const app = document.getElementById('app');
      userEmail = sessionStorage.getItem('giftlyEmail');

      if (!userEmail) {
        app.innerHTML = `
          <div style="max-width:1000px;margin:2rem auto;padding:0 2rem">
            <div class="banner">
              No session found. <a href="signup.html">Sign up</a> to get started.
            </div>
          </div>`;
        return;
      }

      const storedName  = sessionStorage.getItem('giftlyName');
      const firstName   = storedName && storedName.trim()
        ? storedName.trim().split(' ')[0]
        : (s => s.charAt(0).toUpperCase() + s.slice(1))(userEmail.split('@')[0]);

      app.innerHTML = `
        <div class="page-header">
          <div>
            <p class="page-eyebrow">Your dashboard</p>
            <h1>Hello, ${firstName} 👋</h1>
          </div>
          <button class="add-btn" onclick="openModal()">+ Add person</button>
        </div>
        <div class="stats-row" id="statsRow"></div>
        <div id="upgradeBannerWrap"></div>
        <div class="profile-grid-wrap" id="gridWrap">
          ${renderSkeleton(3)}
        </div>`;

      const upgradeResult = new URLSearchParams(window.location.search).get('upgrade');
      if (upgradeResult) history.replaceState(null, '', window.location.pathname);

      try {
        const [profilesRes, userRes] = await Promise.all([
          fetch(`/profiles?email=${encodeURIComponent(userEmail)}`),
          fetch(`/user?email=${encodeURIComponent(userEmail)}`),
        ]);

        profiles = await profilesRes.json();
        try {
          const userData = await userRes.json();
          subscriptionStatus = userData.subscriptionStatus || 'free';
        } catch (e) {}

        if (upgradeResult === 'success') subscriptionStatus = 'active';

        renderUpgradeBanner();
        renderStats();
        renderGrid();

        if (upgradeResult === 'success') showToast('🎉 Welcome to Giftly Pro!', 'success');
        else if (upgradeResult === 'canceled') showToast('Upgrade canceled. You can upgrade anytime.');
      } catch (err) {
        document.getElementById('gridWrap').innerHTML = `
          <div class="empty">
            <div class="empty-icon">⚠️</div>
            <h2>Could not load profiles</h2>
            <p>Make sure the Giftly server is running on port 3000.</p>
          </div>`;
      }
    }

    init();
  </script>

</body>
</html>

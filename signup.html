<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giftly – Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:      #FDF8F2;
      --ink:        #1A1410;
      --blush:      #F2A28A;
      --blush-dark: #D97B5C;
      --muted:      #7A6F68;
      --border:     #E8E0D8;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-link {
      font-size: 0.9rem;
      color: var(--muted);
      text-decoration: none;
    }

    .nav-link:hover { color: var(--ink); }

    .page {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 5rem 2rem;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    .card-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blush-dark);
      margin-bottom: 0.75rem;
    }

    .card h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }

    .card-sub {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 1.2rem;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--ink);
    }

    .field input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      background: var(--cream);
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus {
      border-color: var(--blush-dark);
    }

    .btn-primary {
      width: 100%;
      background: var(--blush);
      color: var(--ink);
      border: none;
      padding: 0.85rem;
      border-radius: 100px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-primary:hover {
      background: var(--blush-dark);
      color: var(--cream);
      transform: translateY(-1px);
    }

    .divider {
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      margin: 1.5rem 0;
      position: relative;
    }

    .divider::before, .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border);
    }

    .divider::before { left: 0; }
    .divider::after { right: 0; }

    .login-link {
      text-align: center;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .login-link a {
      color: var(--blush-dark);
      text-decoration: none;
      font-weight: 500;
    }

    .login-link a:hover { text-decoration: underline; }

    .success-msg {
      display: none;
      background: #F0FFF4;
      border: 1px solid #9AE6B4;
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      font-size: 0.92rem;
      color: #276749;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">Giftly</a>
    <a href="index.html" class="nav-link">← Back to home</a>
  </nav>

  <div class="page">
    <div class="card">
      <p class="card-eyebrow">Get started free</p>
      <h1>Create your account</h1>
      <p class="card-sub">Join Giftly and never miss a birthday, anniversary, or special moment again.</p>

      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" />
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" />
      </div>

      <button class="btn-primary" onclick="handleSignup()">Create account</button>

      <div class="success-msg" id="successMsg">
        🎉 Account created! We'll be in touch soon.
      </div>

      <div class="divider">or</div>

      <p class="login-link">Already have an account? <a href="#">Log in</a></p>
    </div>
  </div>

  <script>
    function handleSignup() {
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!name || !email || !password) {
        alert('Please fill in all fields.');
        return;
      }

      document.getElementById('successMsg').style.display = 'block';
      setTimeout(() => { window.location.href = 'profiles.html'; }, 1500);
    }
  </script>

</body>
</html>
